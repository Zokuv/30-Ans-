<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>30 Ans Pokémon</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}header{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 10px 10px;background:rgba(11,11,13,.94);backdrop-filter:blur(18px)}.top{display:flex;align-items:end;justify-content:space-between;gap:8px}h1{font-size:20px;margin:0}.sub{font-size:11px;color:#999;margin-top:2px}#count{font-size:22px;font-weight:850}.bar{height:5px;background:#29292d;border-radius:99px;margin-top:9px;overflow:hidden}#fill{height:100%;width:0;background:#fff}.controls{display:flex;gap:7px;margin-top:9px}input,button{border:1px solid #303036;background:#18181b;color:#fff;border-radius:10px;padding:10px;font-size:14px}input{flex:1;min-width:0}button{font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px 7px 70px}.card{min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.img{position:relative;aspect-ratio:2.5/3.5;border-radius:6px;overflow:hidden;background:#202024}.img img{width:100%;height:100%;display:block;object-fit:cover}.card.owned img{filter:brightness(.34) saturate(.45)}.card.owned .img{outline:2px solid white;outline-offset:-2px}.check{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:31px;font-weight:900;text-shadow:0 2px 7px #000}.owned .check{display:flex}.label{font-size:9px;color:#b7b7bd;margin:3px 1px 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(min-width:600px){.grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;padding:12px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(10,minmax(0,1fr));max-width:1500px;margin:auto}}</style></head>
<body><header><div class="top"><div><h1>30ᵉ Anniversaire</h1><div class="sub">Scans FR PokéCardex · Mew RGB exclus</div></div><div id="count">0 / 188</div></div><div class="bar"><div id="fill"></div></div><div class="controls"><input id="q" placeholder="Rechercher un numéro…"><button id="missing">Manquantes</button></div></header><main class="grid" id="grid"></main>
<script>
const EXCLUDED=new Set([189,190,191]),cards=[];for(let i=1;i<=191;i++){if(!EXCLUDED.has(i))cards.push({id:String(i),name:"#"+String(i).padStart(3,"0"),url:"https://pokecardex-scans.b-cdn.net/sets/30C/FR/"+i+".jpg?class=md"})}
const KEY="zkv_30ans_owned_v1";let owned={};try{owned=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}let onlyMissing=false;
const grid=document.getElementById("grid"),q=document.getElementById("q"),count=document.getElementById("count"),fill=document.getElementById("fill"),mb=document.getElementById("missing");
function render(){const s=q.value.trim().toLowerCase();grid.innerHTML="";let n=0;for(const c of cards){if(owned[c.id])n++;if(onlyMissing&&owned[c.id])continue;if(!(c.name+" "+c.id).toLowerCase().includes(s))continue;const e=document.createElement("div");e.className="card"+(owned[c.id]?" owned":"");e.dataset.id=c.id;e.innerHTML='<div class="img"><img loading="lazy" src="'+c.url+'" alt="'+c.name+'"><div class="check">✓</div></div><div class="label">'+c.name+'</div>';e.addEventListener("click",()=>{owned[c.id]=!owned[c.id];try{localStorage.setItem(KEY,JSON.stringify(owned))}catch(x){}render()});grid.appendChild(e)}count.textContent=n+" / "+cards.length;fill.style.width=(n/cards.length*100)+"%"}
q.addEventListener("input",render);mb.addEventListener("click",()=>{onlyMissing=!onlyMissing;mb.textContent=onlyMissing?"Toutes":"Manquantes";render()});render();
</script></body></html>
